[build]
  # Directory to change to before starting a build
  base = "frontend"
  # Directory that contains the deploy-ready HTML files and assets (relative to base)
  publish = "build"
  # Build command
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Redirect all routes to index.html for React Router (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

